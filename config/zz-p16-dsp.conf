# Keep the known-good P16 DSP route in every normal managed kernel UKI.
# The rescue/fallback command line is separate and retains its text-console path.
KERNEL_CMDLINE[default]+=" module_blacklist=snd_sof_mt8901 n1x_adsp.auto_boot=1 n1x_adsp.enable_retention_sleep=1 snd_soc_mt8901_afe.dsp_playback=1 snd_soc_mt8901_afe.dsp_capture=1 mt8901_acp_sdw_legacy_mach.dsp_playback=1"
